name: Build Sonix USB Camera Driver (gspca_sonixb)

on:
  workflow_dispatch:
    inputs:
      kbranch:
        description: "ACK branch matching your kernel: android13-5.15 | android14-6.1 | android12-5.10 | android15-6.6"
        required: true
        default: "android13-5.15"
      kcommit:
        description: "Exact ACK commit (COMMIT_SHORT / full hash). Default is Samsung Galaxy A35 5G."
        required: true
        default: "e787d6ac4af04c06a0120ad773820d43f9b851a9"
      clang_ver:
        description: "Android Clang version (e.g. clang-r450784d)."
        required: true
        default: "clang-r450784d"
      btf:
        description: "Keep CONFIG_DEBUG_INFO_BTF? (y/n)"
        required: true
        default: "y"
      lto:
        description: "LTO mode to match device: thin | full | none"
        required: true
        default: "thin"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show inputs
        id: info
        run: |
          echo "branch  = ${{ github.event.inputs.kbranch }}"
          echo "commit  = ${{ github.event.inputs.kcommit }}"
          echo "clang   = ${{ github.event.inputs.clang_ver }}"
          echo "btf     = ${{ github.event.inputs.btf }}"
          echo "lto     = ${{ github.event.inputs.lto }}"
          echo "target  = Sonix USB Camera (0c45:6005 / gspca_sonixb)"
          SHORT=$(echo "${{ github.event.inputs.kcommit }}" | cut -c1-12)
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: Install deps
        run: |
          # 1) Reliable public DNS resolvers (Cloudflare, Google, Quad9)
          sudo sh -c 'printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\nnameserver 9.9.9.9\n" > /etc/resolv.conf'

          # 2) Populate multi-mirror fallback list
          sudo sh -c 'cat > /etc/apt/apt-mirrors.txt << "EOF"
          http://archive.ubuntu.com/ubuntu/
          http://mirrors.edge.kernel.org/ubuntu/
          http://ftp.osuosl.org/pub/ubuntu/
          http://mirror.math.princeton.edu/pub/ubuntu/
          EOF'
          sudo sed -i 's|http://.*azure.*ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true

          # 3) Resilient mirror update loop with automatic fallback
          UPDATED=0
          for M in "http://archive.ubuntu.com/ubuntu" "http://mirrors.edge.kernel.org/ubuntu" "http://ftp.osuosl.org/pub/ubuntu"; do
            echo "Attempting apt update using mirror: $M"
            sudo sed -i "s|http://archive.ubuntu.com/ubuntu|$M|g" /etc/apt/sources.list 2>/dev/null || true
            if sudo apt-get update -y; then
              UPDATED=1
              break
            fi
            sleep 2
          done

          sudo apt-get install -y -o Acquire::Retries=5 --fix-missing \
            bc bison flex libssl-dev libelf-dev \
            lz4 cpio kmod git curl zip file dwarves
          pahole --version || true

      - name: Verify commit is public
        run: |
          H="${{ github.event.inputs.kcommit }}"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://android.googlesource.com/kernel/common/+/$H")
          echo "gitiles HTTP $CODE for $H"
          if [ "$CODE" != "200" ]; then
            echo "::error::Commit $H is not public on ACK."
            exit 1
          fi

      - name: Restore Kernel & Clang Cache
        id: cache-kernel
        uses: actions/cache/restore@v4
        with:
          path: |
            ks
            clang
          key: gki-kernel-${{ github.event.inputs.kcommit }}-${{ github.event.inputs.clang_ver }}-${{ github.event.inputs.lto }}-${{ github.event.inputs.btf }}-sonix1

      - name: Fetch kernel source (exact commit)
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: |
          mkdir -p ks
          URL="https://android.googlesource.com/kernel/common/+archive/${{ github.event.inputs.kcommit }}.tar.gz"
          ok=0
          for try in 1 2 3 4 5; do
            echo "kernel source download, attempt $try ..."
            rm -f k.tar.gz
            if curl -fsSL --retry 3 --retry-delay 3 --retry-all-errors \
                 --http1.1 "$URL" -o k.tar.gz \
               && gzip -t k.tar.gz 2>/dev/null; then
              ok=1; break
            fi
            echo "  incomplete/corrupt, retrying..."; sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Could not download the kernel source archive after 5 attempts."
            exit 1
          fi
          tar -xzf k.tar.gz -C ks
          rm -f k.tar.gz
          ls ks/Makefile && head -3 ks/Makefile

      - name: Fetch Android Clang
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang
          CV="${{ github.event.inputs.clang_ver }}"
          got=0
          fetch() {
            for try in 1 2 3; do
              if curl -fsSL --retry 3 --retry-delay 2 "$1" -o c.tar.gz \
                 && file c.tar.gz | grep -q gzip; then return 0; fi
              echo "   retry $try failed"; sleep 3
            done
            return 1
          }
          for BR in android13-release android14-release android12-release android15-release android16-release main master; do
            URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/$BR/$CV.tar.gz"
            echo "Trying $BR ..."
            if fetch "$URL"; then
              tar -xzf c.tar.gz -C clang && got=1 && echo "OK from $BR" && break
            fi
            rm -f c.tar.gz
          done
          if [ "$got" != "1" ]; then
            echo "::error::Could not fetch $CV from any known branch."
            exit 1
          fi
          clang/bin/clang --version

      - name: Configure kernel
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        working-directory: ks
        env:
          BTF: ${{ github.event.inputs.btf }}
          LTO: ${{ github.event.inputs.lto }}
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          {
            echo "CONFIG_MEDIA_SUPPORT=y"
            echo "CONFIG_VIDEO_DEV=y"
            echo "CONFIG_MEDIA_USB_SUPPORT=y"
            echo "CONFIG_USB_GSPCA=m"
            echo "CONFIG_USB_GSPCA_SONIXB=m"
            echo "CONFIG_USB_GSPCA_SONIXJ=m"
          } >> arch/arm64/configs/gki_defconfig

          make LLVM=1 ARCH=arm64 O=out gki_defconfig

          if [ "$BTF" != "y" ]; then
            ./scripts/config --file out/.config -d DEBUG_INFO_BTF
          fi
          case "$LTO" in
            thin) ./scripts/config --file out/.config -d LTO_CLANG_FULL -e LTO_CLANG_THIN ;;
            none) ./scripts/config --file out/.config -d LTO_CLANG_FULL -d LTO_CLANG_THIN -e LTO_NONE ;;
            *)    : ;;
          esac

          make LLVM=1 ARCH=arm64 O=out olddefconfig

      - name: Prepare kernel for external modules
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        working-directory: ks
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          make LLVM=1 ARCH=arm64 O=out modules_prepare

      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Save Kernel & Clang Cache
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ks
            clang
          key: ${{ steps.cache-kernel.outputs.cache-primary-key || format('gki-kernel-{0}-{1}-{2}-{3}-sonix1', github.event.inputs.kcommit, github.event.inputs.clang_ver, github.event.inputs.lto, github.event.inputs.btf) }}

      - name: Build standard GSPCA & Sonix modules
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          echo "Building in-tree GSPCA modules against prepared kernel..."
          make -j$(nproc) -C "$GITHUB_WORKSPACE/ks/out" \
            M="drivers/media/usb/gspca" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 CC=clang LD=ld.lld \
            modules

          find ks/drivers/media/usb/gspca -name "*.ko" -exec ls -la {} \;

      - name: Build standalone composite Sonix module
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          echo "Building standalone all-in-one Sonix module (gspca_sonixb_standalone.ko)..."
          mkdir -p oot_standalone
          cp ks/drivers/media/usb/gspca/gspca.[ch] oot_standalone/
          cp ks/drivers/media/usb/gspca/autogain_functions.c oot_standalone/
          cp ks/drivers/media/usb/gspca/sonixb.c oot_standalone/

          # Remove separate module_init/module_exit from gspca.c so sonixb.c acts as sole entrypoint
          sed -i 's/^module_init(gspca_init);/\/\/ module_init(gspca_init);/' oot_standalone/gspca.c
          sed -i 's/^module_exit(gspca_exit);/\/\/ module_exit(gspca_exit);/' oot_standalone/gspca.c

          cat > oot_standalone/Makefile << 'EOF'
          ccflags-y += -I$(src) -O2 -std=gnu11 -Wno-declaration-after-statement -Wno-error

          obj-m := gspca_sonixb_standalone.o
          gspca_sonixb_standalone-objs := gspca.o autogain_functions.o sonixb.o
          EOF

          make -j$(nproc) -C "$GITHUB_WORKSPACE/ks/out" \
            M="$(pwd)/oot_standalone" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 CC=clang LD=ld.lld \
            modules

          ls -la oot_standalone/gspca_sonixb_standalone.ko

      - name: Show module_layout CRC
        if: always()
        working-directory: ks
        run: |
          echo "=== module_layout CRC ==="
          grep -w module_layout out/Module.symvers || echo "not found"

      - name: Collect compiled modules
        if: always()
        run: |
          mkdir -p ko
          # Copy standard GSPCA modules
          find ks/drivers/media/usb/gspca -name "gspca_*.ko" -exec cp {} ko/ \; 2>/dev/null || true
          # Copy standalone composite module
          [ -f "oot_standalone/gspca_sonixb_standalone.ko" ] && cp "oot_standalone/gspca_sonixb_standalone.ko" ko/ || true
          # Include Module.symvers for symbol reference
          cp ks/out/Module.symvers ko/ 2>/dev/null || true

          echo "=== Collected kernel modules ==="
          ls -la ko/

      - name: Upload Sonix camera modules
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonix-camera-modules-${{ steps.info.outputs.short || 'out' }}
          path: ko/
